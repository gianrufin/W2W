name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you publish on demand from the Actions tab without waiting for a push.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Turns Pages on for the repo if it has never been enabled.
          enablement: true

      - run: npm ci

      - name: Build static export
        env:
          # A project site is served from /<repo>, so the bundle needs that prefix.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # The public demo runs on the bundled dataset — no Supabase keys are
          # baked into a client bundle.
          NEXT_PUBLIC_USE_MOCK_DATA: 'true'
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
